# SPDX-License-Identifier: AGPL-3.0-or-later
# Checks on every push and pull request (plan B67). The licence check (REUSE) and a sign-off (DCO) on every commit of a
# pull request come from falkoss/starterpack, pinned by commit. Actions are pinned by commit, with the version as a
# comment.
# While the repository is private, the macOS job runs only by hand (workflow_dispatch): macOS minutes count tenfold
# on private repositories. Once public, it runs on every push as well.
name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the crates (job `crates`, plan B192); release.yml builds the app from the same tag
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flakes:
    name: Flakes and guest scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Root flake (QEMU package, guest module) – evaluate all systems
        run: nix flake check --all-systems --no-build
      # Without recipes (they live in omaflake/recipes, which checks them against this flake): evaluates on its own
      - name: Image flake – evaluates
        run: nix flake check --all-systems --no-build "path:$PWD/nix"
      # BrandTokens.swift and crates/omaflake-core/src/brand/tokens.rs are generated from brand/tokens.toml (plan B119)
      - name: Design tokens up to date
        run: python3 brand/tokens.py --check
      # crates/omaflake-i18n/src/de.rs is generated from the macOS app's German Localizable.strings
      - name: Translation tables up to date
        run: python3 scripts/translations.py --check
      - name: Guest agents and scripts parse
        run: |
          for f in nix/modules/*.py; do python3 -I -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done

  rust:
    name: Rust core (fmt, clippy, test)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    # The core drives macOS (Keychain, Virtualization through omaf-runner): built and tested on macOS
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked

  linux:
    name: Linux host (x86_64 package, Rust tests)
    # The Linux app and omaf as `nix run github:omaflake/omaflake#omaflake-gui` builds them (docs/linux.md); the
    # flakes job only evaluates. GitHub's ubuntu-latest is x86_64 – aarch64-linux is built in the lab VM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Package omaflake-gui (x86_64-linux)
        run: nix build --print-build-logs .#packages.x86_64-linux.omaflake-gui
      - name: Smoke test – omaf runs
        run: ./result/bin/omaf --version
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Test (Linux host code paths)
        run: cargo test --locked
      # The guest agent is its own workspace; its tests also run in the image build's checkPhase, where a failing
      # test breaks every NixOS image (plan B172) – caught here first
      - name: Guest agent – clippy and test
        # The agent links libasound (MIDI through ALSA); the runner has no ALSA development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev
          cargo clippy --all-targets --locked --manifest-path nix/agent/Cargo.toml
          cargo test --locked --manifest-path nix/agent/Cargo.toml

  swift:
    name: Build and test (macOS)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    # macOS 27 SDK needed (Package.swift): GitHub's xcode-27 image (preview; macOS 27.0.1, Xcode 27.0 by default)
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode – the image's default; the macOS 27 SDK is needed (Package.swift)
        run: |
          xcodebuild -version
          sdk=$(xcrun --show-sdk-version)
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::error::macOS SDK $sdk – omaflake needs the macOS 27 SDK (Xcode 27). Use the xcode-27 image or set the repository variable MACOS_RUNNER to a runner with Xcode 27."
            exit 1
          fi
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        # A test that waits forever held a macOS runner for six hours and every release behind it (plan B176); one at a
        # time: in parallel on the runner's few cores one run in two still hung after the PortWriter fix (its output
        # comes only at the end, so it does not say which test) – the suite takes a second either way
        timeout-minutes: 15
        run: swift test --no-parallel
      # The bundle carries the Rust `omaf` (the app's core, `omaf serve`)
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: App bundle (ad hoc)
        run: scripts/bundle-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omaflake-app-adhoc
          path: build/omaflake.app
          retention-days: 7

  dependencies:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Every crate on crates.io, from a version tag once the checks passed (plan B192): Trusted Publishing from this
  # workflow and the environment `crates-io` (its approval is the maintainer's), in the order they depend on each
  # other; a version already there is skipped, so a run can be repeated. The tag must be on main and name the version.
  crates:
    needs: [linux, dependencies, licences]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: The tag is on main and names the workspace's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: release a commit of main"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "omaflake-core") | .version')
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "::error::the crates are $version, the tag $GITHUB_REF_NAME"; exit 1; }
          agent=$(cargo metadata --no-deps --format-version 1 --manifest-path nix/agent/Cargo.toml | jq -r '.packages[0].version')
          test "$agent" = "$version" || { echo "::error::the guest agent is $agent, the crates $version"; exit 1; }
      # The guest agent links libasound (MIDI through ALSA); its package is built to check it
      - name: ALSA development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          there() {
            curl -fsS -A "omaflake release (https://github.com/omaflake/omaflake)" \
              "https://crates.io/api/v1/crates/$1/$version" >/dev/null 2>&1
          }
          for name in omaflake-macros omaflake-i18n omaflake-sdk omaflake-core omaflake-tui omaflake omaflake-gui; do
            if there "$name"; then echo "$name $version is on crates.io already"; continue; fi
            # The Linux app needs a desktop's libraries to compile, which this runner lacks: its package is checked
            # by the linux job's Nix build and before a release by `cargo package --workspace`
            verify=""; [ "$name" = omaflake-gui ] && verify=--no-verify
            cargo publish --locked $verify -p "$name"
          done
          if there omaflake-agent; then
            echo "omaflake-agent $version is on crates.io already"
          else
            cargo publish --locked --manifest-path nix/agent/Cargo.toml
          fi

  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
