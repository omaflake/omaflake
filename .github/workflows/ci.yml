# SPDX-License-Identifier: AGPL-3.0-or-later
# Checks on every push and pull request (plan B67). The licence check (REUSE) and a sign-off (DCO) on every commit of a
# pull request come from falkoss/starterpack, pinned by commit. Actions are pinned by commit, with the version as a
# comment.
# While the repository is private, the macOS job runs only by hand (workflow_dispatch): macOS minutes count tenfold
# on private repositories. Once public, it runs on every push as well.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flakes:
    name: Flakes and guest scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Root flake (QEMU package, guest module) – evaluate all systems
        run: nix flake check --all-systems --no-build
      # Without recipes (they live in omaflake/recipes, which checks them against this flake): evaluates on its own
      - name: Image flake – evaluates
        run: nix flake check --all-systems --no-build "path:$PWD/nix"
      # BrandTokens.swift and crates/omaflake-brand/src/tokens.rs are generated from brand/tokens.toml (plan B119)
      - name: Design tokens up to date
        run: python3 brand/tokens.py --check
      # crates/omaflake-i18n/src/de.rs is generated from the macOS app's German Localizable.strings
      - name: Translation tables up to date
        run: python3 scripts/translations.py --check
      - name: Guest agents and scripts parse
        run: |
          for f in nix/modules/*.py; do python3 -I -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done

  rust:
    name: Rust core (fmt, clippy, test)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    # The core drives macOS (Keychain, Virtualization through omaf-runner): built and tested on macOS
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked

  linux:
    name: Linux host (x86_64 package, Rust tests)
    # The Linux app and omaf as `nix run github:omaflake/omaflake#omaflake-gui` builds them (docs/linux.md); the
    # flakes job only evaluates. GitHub's ubuntu-latest is x86_64 – aarch64-linux is built in the lab VM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Package omaflake-gui (x86_64-linux)
        run: nix build --print-build-logs .#packages.x86_64-linux.omaflake-gui
      - name: Smoke test – omaf runs
        run: ./result/bin/omaf --version
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Test (Linux host code paths)
        run: cargo test --locked

  swift:
    name: Build and test (macOS)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    # macOS 27 SDK needed (Package.swift): GitHub's xcode-27 image (preview; macOS 27.0.1, Xcode 27.0 by default)
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode – the image's default; the macOS 27 SDK is needed (Package.swift)
        run: |
          xcodebuild -version
          sdk=$(xcrun --show-sdk-version)
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::error::macOS SDK $sdk – omaflake needs the macOS 27 SDK (Xcode 27). Use the xcode-27 image or set the repository variable MACOS_RUNNER to a runner with Xcode 27."
            exit 1
          fi
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # The bundle carries the Rust `omaf` (the app's core, `omaf serve`)
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: App bundle (ad hoc)
        run: scripts/bundle-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omaflake-app-adhoc
          path: build/omaflake.app
          retention-days: 7

  dependencies:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
