# Builds omaflake's QEMU (virglrenderer, libepoxy, ANGLE from nixpkgs) and fills the binary cache, so users do not
# compile it (spec §11.8, plan B67). By hand, on version tags, and weekly (nixpkgs moves).
# Cache: Cachix (secret CACHIX_AUTH_TOKEN, variable CACHIX_CACHE) or an S3-compatible bucket (secrets NIX_SIGNING_KEY,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY; variable NIX_S3_CACHE, e.g. s3://omaflake-cache?endpoint=…&region=auto).
# Without them the job only builds.
name: QEMU package

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  qemu:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Cachix
        if: ${{ vars.CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build
        run: nix build .#qemu --print-build-logs --out-link result-qemu
      - name: Push to the S3 cache
        if: ${{ vars.NIX_S3_CACHE != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          printf '%s' "$NIX_SIGNING_KEY" > "$RUNNER_TEMP/cache-key"
          nix store sign --key-file "$RUNNER_TEMP/cache-key" --recursive ./result-qemu
          nix copy --to "${{ vars.NIX_S3_CACHE }}" ./result-qemu
