# SPDX-License-Identifier: AGPL-3.0-or-later
# omaflake.dev – the developer documentation, built by GitHub Pages from this folder (Jekyll, Just the Docs).
# The JSON Schemas in schema/ are served as they are; the users' pages live on omaflake.app (omaflake/website).
title: omaflake
description: Developer documentation – clean NixOS and macOS VMs on Mac and Linux
url: https://omaflake.dev
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

color_scheme: omaflake
favicon_ico: /assets/favicon.ico
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub: https://github.com/omaflake/omaflake
  Recipes: https://github.com/omaflake/recipes
  omaflake.app: https://omaflake.app
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/omaflake/omaflake
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: "omaflake is free software under AGPL-3.0-or-later – a falkOSS project."

# Every page uses the theme's layout (GitHub Pages would default to it as well; a local build does not)
defaults:
  - scope:
      path: ""
    values:
      layout: default

# The working notes stay in the repository, not on the site
exclude:
  - plan.md
