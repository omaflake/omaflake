# SPDX-License-Identifier: AGPL-3.0-or-later
# Rust core of omaflake (port of Sources/OmaflakeCore, see crates/omaflake-core/PORTING.md).
# nix/agent is the guest agent's own Cargo project (built by Nix), not a member of this workspace.

[workspace]
resolver = "3"
members = ["crates/omaflake-core", "crates/omaflake-sdk", "crates/omaflake", "crates/omaflake-tui", "crates/omaflake-gui",
    "crates/omaflake-i18n", "crates/omaflake-macros"]
exclude = ["nix/agent"]

# Keep target/ small: line tables are enough for backtraces; dependencies get no debug info.
# scripts/trim-target.sh removes what interrupted builds leave behind.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.8.1"
edition = "2024"
# The oldest Rust that builds omaflake: nixpkgs' rustc (linux/package.nix); development and CI use rust-toolchain.toml
rust-version = "1.98"
license = "AGPL-3.0-or-later"
# Every crate is on crates.io, in step with omaflake's version (plan B192); the guest agent (nix/agent) too
publish = true
repository = "https://github.com/omaflake/omaflake"
homepage = "https://omaflake.dev"

# Exact versions, each the newest that is at least 14 days old (scripts/check-age.py); a fix for a security advisory may
# be younger.
[workspace.dependencies]
# omaflake's own crates: the path here, the version on crates.io – raise it with workspace.package's version
omaflake-core = { path = "crates/omaflake-core", version = "0.8.1" }
omaflake-sdk = { path = "crates/omaflake-sdk", version = "0.8.1" }
omaflake-tui = { path = "crates/omaflake-tui", version = "0.8.1" }
omaflake-i18n = { path = "crates/omaflake-i18n", version = "0.8.1" }
omaflake-macros = { path = "crates/omaflake-macros", version = "0.8.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.1"
# Dates (plan B167: replaces chrono, RUSTSEC-2026-0543); the local time zone from the system's zoneinfo
jiff = { version = "=0.2.42", default-features = false, features = ["std", "serde", "tz-system", "tzdb-zoneinfo"] }
sha2 = "=0.11.1"
libc = "=0.2.191"
ureq = { version = "=3.5.1", features = ["json"] }
security-framework = "=3.7.0"
tempfile = "=3.27.0"

# omaflake talks to the system through libc (sockets, terminals, signals, video devices) and needs `unsafe` there:
# unsafe_code is not forbidden in the workspace, every block carries a SAFETY comment; the crates without system calls
# forbid it in their lib.rs (omaflake-i18n, omaflake-macros, omaflake-tui).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
