# SPDX-License-Identifier: AGPL-3.0-or-later
# Rust core of omaflake (port of Sources/OmaflakeCore, see crates/omaflake-core/PORTING.md).
# nix/agent is the guest agent's own Cargo project (built by Nix), not a member of this workspace.

[workspace]
resolver = "3"
members = ["crates/omaflake-core", "crates/omaf", "crates/omaflake-brand", "crates/omaflake-tui", "crates/omaflake-gui",
    "crates/omaflake-i18n", "crates/omaflake-macros"]
exclude = ["nix/agent"]

# Keep target/ small: line tables are enough for backtraces; dependencies get no debug info.
# scripts/trim-target.sh removes what interrupted builds leave behind.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.7.2"
edition = "2024"
# The oldest Rust that builds omaflake: nixpkgs' rustc (linux/package.nix); development and CI use rust-toolchain.toml
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/omaflake/omaflake"

# Exact versions, each the newest that is at least 14 days old (scripts/check-age.py); a fix for a security advisory may
# be younger.
[workspace.dependencies]
omaflake-core = { path = "crates/omaflake-core" }
omaflake-i18n = { path = "crates/omaflake-i18n" }
omaflake-macros = { path = "crates/omaflake-macros" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
base64 = "=0.22.1"
libc = "=0.2.190"
ureq = { version = "=3.5.0", features = ["json"] }
security-framework = "=3.7.0"
tempfile = "=3.27.0"

# omaflake talks to the system through libc (sockets, terminals, signals, video devices) and needs `unsafe` there:
# unsafe_code is not forbidden in the workspace, every block carries a SAFETY comment; the crates without system calls
# forbid it in their lib.rs (omaflake-brand, omaflake-i18n, omaflake-macros, omaflake-tui).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
