# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny: what the dependencies may be (CI, job `dependencies`). Known vulnerabilities fail the build, licences
# must be compatible with the AGPL, crates come only from crates.io. A finding that does not affect omaflake is ignored
# below with a reason, never silently.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, but only direct dependencies fail the build.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.93
# Compatible with the AGPL-3.0: permissive licences, weak copyleft (MPL-2.0, LGPL-2.1+) and the AGPL itself. A
# project under MIT removes the copyleft ones that do not fit it.
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA", # libfuzzer-sys (rav1e, through iced's image support with all features) – permissive, GPL-compatible
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
