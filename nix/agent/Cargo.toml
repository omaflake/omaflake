# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "omaflake-agent"
version = "0.7.2"
edition = "2024"
description = "omaflake guest agent: talks to omaflake on the Mac over the virtio port org.omaflake.agent"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
