# Generated by brand/tokens.py from brand/tokens.toml – do not edit.
# The omaflake look ([look] in brand/tokens.toml) as look data – omaflake/catalog has it as
# looks/omaflake/omaflake/look.toml; the image flake turns it into each program's configuration.
"$schema" = "https://omaflake.dev/schema/look/v1.json"
version = "1.0.0"
author = "omaflake"
license = "MIT"
title = "omaflake"
description = "Black and high contrast with white text; red and cyan only as fine accents."
description_de = "Schwarz und kontrastreich mit weißer Schrift; Rot und Cyan nur als feine Akzente."
tags = ["dark", "high-contrast"]
homepage = "https://omaflake.dev"
appearance = "dark"

[colors]
background = "#000000"
surface = "#121212"
selection = "#2A2A2A"
text = "#FFFFFF"
subtext = "#B3B3B3"
muted = "#6E6E6E"
accent = "#00E5FF"
urgent = "#FF3B3B"
cursor = "#00E5FF"

[terminal]
normal = ["#1E1E1E", "#FF3B3B", "#30D158", "#F5FF3B", "#4DA3FF", "#FF66CC", "#00E5FF", "#B3B3B3"]
bright = ["#6E6E6E", "#FF3B3B", "#30D158", "#F5FF3B", "#4DA3FF", "#FF66CC", "#00E5FF", "#FFFFFF"]

[desktop]
border = ["#FF3B3B", "#00E5FF"]   # the active window: the split as a gradient
inactive_border = "#1E1E1E"
clock = "#FFFFFF"
split = ["#FF3B3B", "#00E5FF"]    # the active workspace's number: a 1 px red/cyan edge
prompt = { ok = "#00E5FF", error = "#FF3B3B", directory = "#FFFFFF" }
gtk = "adw-gtk3-dark"
cursor_theme = "Bibata-Modern-Classic"

[neovim]
theme = "modus"
style = "modus_vivendi"

[emacs]
theme = "modus"
style = "modus-vivendi"
