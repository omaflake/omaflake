# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "omaflake-core"
description = "omaflake's core: VM control (QEMU, Virtualization.framework), images, recipes and the service – internal to omaflake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["omaflake", "virtual-machine", "nix", "qemu", "macos"]
categories = ["virtualization"]

[dependencies]
omaflake-sdk.workspace = true
# vm_err!'s keyed errors (plan B125)
omaflake-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jiff.workspace = true
sha2.workspace = true
libc.workspace = true
ureq.workspace = true
# MJPEG camera frames on a Linux host (host_bridge::convert): pure Rust, Zlib/MIT/Apache-2.0
zune-jpeg = "=0.5.15"

# The login Keychain (recipe source tokens, RecipeSources.swift `SourceTokens`)
[target.'cfg(target_os = "macos")'.dependencies]
# "Copy password" asks Touch ID or the login password first (LocalAuthentication, credentials.rs; plan B137)
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2 = "=0.6.5"
block2 = "=0.6.2"
security-framework.workspace = true

# The Secret Service over D-Bus (recipe source tokens, source_tokens.rs): pure Rust (zbus, RustCrypto), MIT/Apache-2.0
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
# Every error and view text has German (src/translated.rs)
omaflake-i18n.workspace = true

[lints]
workspace = true
