# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "omaflake-core"
description = "omaflake's core: paths, stores, recipes, QEMU and macOS VM control (port of Sources/OmaflakeCore)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# vm_err!'s keyed errors (plan B125)
omaflake-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
libc.workspace = true
ureq.workspace = true
# MJPEG camera frames on a Linux host (host_bridge::convert): pure Rust, Zlib/MIT/Apache-2.0
zune-jpeg = "0.5.15"

# The login Keychain (recipe source tokens, RecipeSources.swift `SourceTokens`)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

# The Secret Service over D-Bus (recipe source tokens, source_tokens.rs): pure Rust (zbus, RustCrypto), MIT/Apache-2.0
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
# Every error and view text has German (src/translated.rs)
omaflake-i18n.workspace = true
