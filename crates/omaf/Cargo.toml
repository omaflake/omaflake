# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "omaf"
description = "omaflake's command line and JSON-RPC server (omaf serve)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "omaf"
path = "src/main.rs"

[dependencies]
omaflake-core.workspace = true
omaflake-tui = { path = "../omaflake-tui" }
chrono.workspace = true
libc.workspace = true
serde_json.workspace = true
# The CLI's own parser (swift-argument-parser in the Swift CLI); not a workspace dependency – only omaf uses it
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
