[package]
name = "omaflake-tui"
description = "omaflake's terminal interface (omaf ui): a client of the core's page models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["omaflake", "tui", "ratatui", "virtual-machine"]
categories = ["command-line-interface", "virtualization"]

[dependencies]
omaflake-core.workspace = true
omaflake-i18n.workspace = true
serde_json.workspace = true
jiff.workspace = true
libc.workspace = true
# Only this crate draws a terminal interface (plan B121)
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "=0.29.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
